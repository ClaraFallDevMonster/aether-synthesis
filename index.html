<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Particles - Hand Control</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #bc13fe;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.2);
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            font-family: 'Rajdhani', sans-serif;
            color: white;
            user-select: none;
        }

        canvas { 
            display: block; 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
        }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas */
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 80%, black 100%);
        }

        /* Header */
        .header {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        
        h1 {
            margin: 0;
            font-weight: 300;
            font-size: 2rem;
            text-shadow: 0 0 20px var(--primary);
            opacity: 0.9;
        }
        
        .status {
            font-size: 0.8rem;
            color: var(--primary);
            margin-top: 5px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 1s ease;
        }

        /* Video Feed (Holographic Monitor) */
        #video-container {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 160px;
            height: 120px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(5px);
            background: rgba(0, 20, 40, 0.5);
            pointer-events: auto; /* Allow interaction if needed */
        }
        
        /* The video element inside the container */
        #video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
            transform: scaleX(-1); /* Mirror effect */
        }

        /* Bottom Dock (Controls) */
        .dock-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            padding: 12px 20px;
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            pointer-events: auto;
            transition: transform 0.3s ease;
        }

        .dock-container:hover {
            transform: translateX(-50%) scale(1.02);
            border-color: var(--glass-highlight);
        }

        button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            padding: 10px 24px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        button::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s ease;
        }

        button:hover {
            color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,0.8);
            transform: translateY(-2px);
        }

        button.active {
            color: #000;
            font-weight: 700;
            box-shadow: 0 0 20px var(--primary);
        }

        button.active::before {
            opacity: 1;
        }

        /* Instructions (Floating Cards) */
        .instructions {
            position: absolute;
            bottom: 140px; /* Above the dock */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
            pointer-events: none;
            width: 100%;
            justify-content: center;
        }

        .instruction-item {
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 4px;
            border-left: 2px solid var(--secondary);
            text-shadow: 0 0 5px rgba(0,0,0,1);
            white-space: nowrap;
        }
        
        .key { color: var(--primary); font-weight: bold; margin-right: 5px; }

        /* Scanline Overlay */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 11;
            opacity: 0.3;
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .dock-container { width: 90%; flex-wrap: wrap; justify-content: center; border-radius: 20px; bottom: 20px; }
            .instructions { bottom: 180px; flex-direction: column; align-items: center; gap: 5px; }
            #video-container { width: 100px; height: 75px; top: 10px; right: 10px; }
            button { padding: 8px 16px; font-size: 0.8rem; }
        }

    </style>
    
    <!-- Import Maps for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    
    <div class="scanlines"></div>

    <div id="ui-layer">
        
        <div class="header">
            <h1>Aether Synthesis</h1>
            <div class="status" id="status">INITIALIZING NEURAL LINK...</div>
        </div>

        <!-- Corrected Layout: Video inside the container -->
        <div id="video-container">
            <video id="video-feed" autoplay playsinline></video>
        </div>

        <div class="instructions">
            <div class="instruction-item"><span class="key">HANDS APART</span> Expand</div>
            <div class="instruction-item"><span class="key">PINCH</span> Color Shift</div>
            <div class="instruction-item"><span class="key">WAVE</span> Repel</div>
        </div>

        <div class="dock-container" id="controls">
            <button onclick="setTemplate('saturn')" id="btn-saturn" class="active">Saturn</button>
            <button onclick="setTemplate('fireworks')" id="btn-fireworks">Nova</button>
            <button onclick="setTemplate('heart')" id="btn-heart">Morpho</button>
            <button onclick="setTemplate('flower')" id="btn-flower">Lotus</button>
        </div>

    </div>

    <script type="module">
        import * as THREE from 'three';

        // --- Configuration ---
        const PARTICLE_COUNT = 25000; // Slightly reduced for better performance across devices
        const CAMERA_Z = 50;
        
        // --- State ---
        const state = {
            handDistance: 0.5, 
            isPinching: false,
            hue: 0.55, 
            targetHue: 0.55,
            template: 'saturn',
        };

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = CAMERA_Z;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- Shaders ---
        
        const vertexShader = `
            uniform float uTime;
            uniform float uExpansion;
            uniform vec3 uHandPos1;
            uniform vec3 uHandPos2;
            
            attribute float size;
            
            varying vec3 vColor;
            varying float vDist;

            // Simplex noise function
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) {
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute(
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x;
                p1 *= norm.y;
                p2 *= norm.z;
                p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vec3 pos = position;
                
                // Organic movement
                float noise = snoise(pos * 0.15 + uTime * 0.6);
                pos += normal * noise * 0.8;

                // Interaction
                float d1 = distance(pos, uHandPos1);
                float d2 = distance(pos, uHandPos2);
                float repulsion = 18.0;
                
                // Interactive repulsion
                if (d1 < repulsion) pos += normalize(pos - uHandPos1) * (repulsion - d1) * (1.2 + uExpansion);
                if (d2 < repulsion) pos += normalize(pos - uHandPos2) * (repulsion - d2) * (1.2 + uExpansion);

                // Expansion based on hand distance
                pos *= (0.6 + uExpansion * 1.4);

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_Position = projectionMatrix * mvPosition;

                // Dynamic point size
                gl_PointSize = size * (250.0 / -mvPosition.z);
                vDist = length(pos);
            }
        `;

        const fragmentShader = `
            uniform vec3 uColor;
            varying float vDist;

            void main() {
                vec2 center = gl_PointCoord - 0.5;
                float dist = length(center);
                
                // Glowy Sparkle Shape
                float alpha = 0.1 / (dist * dist * 10.0 + 0.1); 
                alpha *= smoothstep(0.5, 0.0, dist);
                
                if (alpha < 0.01) discard;

                // Depth-based color variation
                vec3 finalColor = uColor + (vDist * 0.02);
                
                // Add hot white core
                finalColor = mix(finalColor, vec3(1.0), alpha * 0.5);

                gl_FragColor = vec4(finalColor, alpha);
            }
        `;

        // --- Particle Generation ---
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const sizes = new Float32Array(PARTICLE_COUNT);
        const normals = new Float32Array(PARTICLE_COUNT * 3);

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            sizes[i] = Math.random() * 0.8 + 0.2;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));

        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uExpansion: { value: 0.5 },
                uColor: { value: new THREE.Color(0x00f3ff) },
                uHandPos1: { value: new THREE.Vector3(1000, 1000, 0) },
                uHandPos2: { value: new THREE.Vector3(1000, 1000, 0) }
            },
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- Templates ---
        const templates = {
            saturn: (i, pos, norm) => {
                const angle = Math.random() * Math.PI * 2;
                let r = 10 + Math.random() * 15; 
                if (Math.random() < 0.2) r = Math.random() * 9; 
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                const y = (Math.random() - 0.5) * (r * 0.15); 
                pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
                norm[i*3] = x; norm[i*3+1] = y; norm[i*3+2] = z;
            },
            fireworks: (i, pos, norm) => {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const r = Math.pow(Math.random(), 0.5) * 18; 
                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta);
                const z = r * Math.cos(phi);
                pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
                norm[i*3] = x; norm[i*3+1] = y; norm[i*3+2] = z;
            },
            heart: (i, pos, norm) => {
                const t = Math.random() * Math.PI * 2;
                const scale = 0.6;
                const x = scale * (16 * Math.pow(Math.sin(t), 3));
                const y = scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                const z = (Math.random() - 0.5) * 6 * Math.sin(t);
                pos[i*3] = x + (Math.random()-0.5); 
                pos[i*3+1] = y + (Math.random()-0.5); 
                pos[i*3+2] = z;
                norm[i*3] = x; norm[i*3+1] = y; norm[i*3+2] = z;
            },
            flower: (i, pos, norm) => {
                const angle = i * 137.5 * (Math.PI / 180);
                const r = 0.6 * Math.sqrt(i) * 0.15;
                const z = Math.sin(r * 0.8) * 6;
                const x = r * Math.cos(angle);
                const y = r * Math.sin(angle);
                pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
                norm[i*3] = x; norm[i*3+1] = y; norm[i*3+2] = z;
            }
        };

        function updateParticles(type) {
            const positions = particles.geometry.attributes.position.array;
            const normals = particles.geometry.attributes.normal.array;
            for (let i = 0; i < PARTICLE_COUNT; i++) templates[type](i, positions, normals);
            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.normal.needsUpdate = true;
        }

        updateParticles('saturn');

        window.setTemplate = (name) => {
            state.template = name;
            updateParticles(name);
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + name).classList.add('active');
        };

        // --- Vision Logic ---
        const videoElement = document.getElementById('video-feed');
        const statusElement = document.getElementById('status');

        function onResults(results) {
            statusElement.style.opacity = "1";
            statusElement.innerText = "LINK ESTABLISHED // TRACKING ACTIVE";
            
            let h1 = null, h2 = null;
            let pinchDetected = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm1 = results.multiHandLandmarks[0];
                h1 = convertToWorld(lm1[9]);
                material.uniforms.uHandPos1.value.copy(h1);
                if (dist(lm1[4], lm1[8]) < 0.05) pinchDetected = true;

                if (results.multiHandLandmarks.length > 1) {
                    const lm2 = results.multiHandLandmarks[1];
                    h2 = convertToWorld(lm2[9]);
                    material.uniforms.uHandPos2.value.copy(h2);
                    if (dist(lm2[4], lm2[8]) < 0.05) pinchDetected = true;
                } else {
                    material.uniforms.uHandPos2.value.set(1000, 1000, 0);
                }
            } else {
                material.uniforms.uHandPos1.value.set(1000, 1000, 0);
                material.uniforms.uHandPos2.value.set(1000, 1000, 0);
                statusElement.innerText = "SEARCHING FOR CONTROLLER...";
                statusElement.style.opacity = "0.7";
            }

            if (h1 && h2) {
                const distance = h1.distanceTo(h2);
                const targetExp = THREE.MathUtils.clamp((distance - 5) / 25, 0, 2);
                state.handDistance = THREE.MathUtils.lerp(state.handDistance, targetExp, 0.1);
            } else {
                state.handDistance = THREE.MathUtils.lerp(state.handDistance, 0.5 + Math.sin(Date.now()*0.001)*0.2, 0.05);
            }
            material.uniforms.uExpansion.value = state.handDistance;

            if (pinchDetected && !state.isPinching) {
                state.isPinching = true;
                state.targetHue = Math.random();
            } else if (!pinchDetected) {
                state.isPinching = false;
            }
        }

        function convertToWorld(landmark) {
            const vec = new THREE.Vector3((landmark.x * 2) - 1, -(landmark.y * 2) + 1, 0.5);
            vec.unproject(camera);
            vec.sub(camera.position).normalize();
            const distance = -camera.position.z / vec.z;
            const pos = new THREE.Vector3().copy(camera.position).add(vec.multiplyScalar(distance));
            pos.x = -pos.x;
            return pos;
        }
        
        function dist(a, b) { return Math.sqrt(Math.pow(a.x - b.x, 2) + Math.pow(a.y - b.y, 2)); }

        // Setup MediaPipe
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);
        
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        cameraUtils.start();

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;
            material.uniforms.uTime.value = time;
            
            state.hue = THREE.MathUtils.lerp(state.hue, state.targetHue, 0.05);
            material.uniforms.uColor.value.setHSL(state.hue, 1.0, 0.6);
            
            particles.rotation.y = time * 0.08;
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
